version: 2
project_name: xpath-go

# Build configuration
builds:
  - id: xpath-example
    dir: cmd/examples/basic
    main: ./main.go
    binary: xpath-example
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/reclaimprotocol/xpath-go.GitCommit={{.ShortCommit}}
      - -X github.com/reclaimprotocol/xpath-go.BuildTime={{.Date}}

# Archive configuration
archives:
  - id: default
    ids:
      - xpath-example
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - "docs/**"
      - "cmd/examples/**"

# Checksum configuration
checksum:
  name_template: "checksums.txt"

# Snapshot configuration
snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# Release configuration
release:
  github:
    owner: reclaimprotocol
    name: xpath-go
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## XPath Go v{{.Version}}
    
    🎯 **Browser-Oriented XPath Library for Go**
    
    This release provides the XPath behavior documented by the checked-in compatibility suite with precise source-byte location tracking.
    
    ### ✨ Highlights
    - **Browser Compatibility**: Validated against the checked-in jsdom oracle
    - **Location Tracking**: Precise byte offsets in original HTML input
    - **Documented Scope**: Explicit compatibility boundaries and regression tests
    
    ### What's Changed
  footer: |
    **Full Changelog**: https://github.com/reclaimprotocol/xpath-go/compare/{{.PreviousTag}}...{{.Tag}}

# Changelog configuration
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
      - "^refactor:"
  groups:
    - title: "New Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: "Performance Improvements"
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: "Other Changes"
      order: 999

# Git configuration
git:
  ignore_tags: []

# Before hooks
before:
  hooks:
    - go mod tidy
    - go mod verify
    - go test -short ./...
